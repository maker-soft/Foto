name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "school/**"
      - "kindergarten/**"
      - "sitemap.xml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit public URLs to IndexNow
        env:
          INDEXNOW_KEY: 9f4bb50d3f394517b73f681fc4c99e7b
        run: |
          curl --fail-with-body --retry 3 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"photobook-nsk.ru\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"https://photobook-nsk.ru/${INDEXNOW_KEY}.txt\",\"urlList\":[\"https://photobook-nsk.ru/\",\"https://photobook-nsk.ru/school/\",\"https://photobook-nsk.ru/kindergarten/\"]}" \
            https://api.indexnow.org/indexnow
